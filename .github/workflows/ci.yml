name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install pinned runtime dependencies and dev tools
        run: |
          pip install -r requirements.lock
          pip install pytest pytest-cov respx ruff mypy numpy
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Validate fact files
        run: python scripts/validate_data.py
      - name: Tests with coverage (offline; NASA and GBIF calls are mocked or read from committed snapshots)
        run: pytest -q --cov

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t island-echoes .
      - name: Start it and read /api/health
        run: |
          docker run -d --name app -p 8000:8000 -e LLM_PROVIDER=extractive island-echoes
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && exit 0; sleep 2; done
          docker logs app
          exit 1
