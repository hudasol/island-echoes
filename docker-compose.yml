# One command: docker compose up --build   (then open http://localhost:8000)
#
# Default: keyword retrieval and the no model chat, which needs nothing else.
# With a local model:  docker compose --profile ollama up --build
#                      docker compose exec ollama ollama pull qwen2.5:3b-instruct
#   and set in .env:   LLM_PROVIDER=ollama  OLLAMA_URL=http://ollama:11434  RETRIEVAL_MODE=hybrid  WITH_ML=1
services:
  app:
    build:
      context: .
      args:
        WITH_ML: ${WITH_ML:-0}
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-bm25}
    volumes:
      - cache:/srv/app/data/cache
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  cache:
  models:
