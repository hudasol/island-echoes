[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "island-echoes"
dynamic = ["version", "dependencies"]
description = "A 3D globe of seven remote islands with a cited fact library and an optional chat that must cite its sources."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Huda Mueen" }]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.5", "mypy>=1.10", "numpy>=1.26"]
ml = ["numpy>=1.26", "fastembed>=0.4,<1"]

[project.urls]
Repository = "https://github.com/hudasol/island-echoes"

[tool.setuptools]
packages = ["app", "app.chat", "app.data", "app.llm", "app.retrieval", "app.routes", "app.telemetry"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
skip_covered = true

[tool.mypy]
python_version = "3.13"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
