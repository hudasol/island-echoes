# Render blueprint: one web service serves the API and the static globe app.
services:
  - type: web
    name: island-echoes
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ANTHROPIC_API_KEY
        sync: false   # set in the Render dashboard, never in the repo
      - key: CHAT_DAILY_CAP
        value: "400"
